# All pipeline parameters. Decision IDs refer to docs/DECISIONS.md.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results

sec_user_agent: "MS499-research-pipeline research@example.org"   # D-013; override with env SEC_USER_AGENT

timing:
  risk_lag_bdays: 2            # D-005
  risk_max_age_months: 15      # D-007: valid while month <= filing month + 15
  mkt_buffer_months: 1         # D-006: first usable month = quarter-end month + 1 + buffer
  mkt_max_age_months: 6        # D-007
  shares_lag_months: 1         # D-012: XBRL facts usable from month after filed + 1 month
  fund_lag_months: 1

sample:                        # D-008 (return months)
  primary_start: "2010-01"
  extended_start: "2006-07"
  end: "2025-05"            # D-029: 2025-06 universe collapses (FY2024 10-Ks absent)
  first_test_year: 2014        # walk-forward dev OOS 2014..2021
  last_dev_year: 2021

test:                          # locked final window (rule 5). Flip only after logging the unlock in DECISIONS.md
  start: "2022-01"
  unlocked: true

universe:                      # D-009
  exchanges: ["NYSE", "Nasdaq"]
  min_price: 5.0
  min_mcap_musd: 100
  min_history_months: 12
  exclude_sic: [[6000, 6999], [4900, 4949]]

portfolio:
  n_quantiles: 10
  min_names: 20
  costs_bps: [10, 25, 50]
  nw_lags: 6

seed: 42
